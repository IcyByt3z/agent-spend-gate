# Render Blueprint: the gate (paid, with a disk for its SQLite database) and the demo
# seller (free). Test network only: the buyer key must hold Base Sepolia test funds only.
#
# Values marked sync: false are asked for when the Blueprint is created and are never
# stored in this file. DEMO_SELLER_URL is the demo seller's address once Render shows it.

services:
  - type: web
    name: agent-spend-gate
    runtime: node
    plan: starter
    rootDir: gate
    buildCommand: npm ci
    startCommand: node src/server.ts
    healthCheckPath: /health
    # One instance only: budget holds are kept in memory.
    numInstances: 1
    disk:
      name: gate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/gate.db
      - key: CATALOG_FILE
        value: config/catalog.render.json
      - key: RAIL
        value: x402
      - key: BUYER_PRIVATE_KEY
        sync: false
      - key: DEMO_SELLER_URL
        sync: false

  - type: web
    name: agent-spend-demo-seller
    runtime: node
    plan: free
    rootDir: gate
    buildCommand: npm ci
    startCommand: node src/seller.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: SELLER_PAY_TO
        sync: false
